name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env for docker compose
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Build web image
        run: docker compose build web

      - name: Start postgres
        run: docker compose up -d postgres

      - name: Wait for postgres
        run: |
          until docker compose exec -T postgres pg_isready -U monitor; do
            sleep 1
          done

      - name: Create test database
        run: |
          exists=$(docker compose exec -T postgres psql -U monitor -tc "SELECT 1 FROM pg_database WHERE datname='monitor_test';" | tr -d '[:space:]')
          if [ "$exists" != "1" ]; then
            docker compose exec -T postgres psql -U monitor -c "CREATE DATABASE monitor_test;"
          fi

      - name: Run tests
        run: docker compose run --rm -e DATABASE_URL_TEST=postgresql+psycopg2://monitor:monitor@postgres:5432/monitor_test web python -m pytest
