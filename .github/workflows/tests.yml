name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env for CI
        run: |
          echo "MONITOR_DB_USER=monitor" >> .env
          echo "MONITOR_DB_PASSWORD=monitor_ci" >> .env
          echo "MONITOR_DB_NAME=monitor" >> .env
          echo "MONITOR_SECRET_KEY=ci-secret-key" >> .env
          echo "ARCA_WEB=https://www.afip.gob.ar/landing/default.asp" >> .env
          echo "PLAYWRIGHT_HEADLESS=1" >> .env
          echo "RECORDING=FALSE" >> .env

      - name: Build web image
        run: docker compose build web

      - name: Start services
        run: docker compose up -d postgres redis

      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U monitor -d monitor; then
              # Verify we can actually connect and run a query
              if docker compose exec -T postgres psql -U monitor -d monitor -c "SELECT 1" > /dev/null 2>&1; then
                echo "Postgres is ready"
                exit 0
              fi
            fi
            echo "Waiting for postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres failed to become ready"
          exit 1

      - name: Create test database
        run: |
          docker compose exec -T postgres psql -U monitor -c "CREATE DATABASE monitor_test;" || true

      - name: Run tests
        run: docker compose run --rm web python -m pytest
