services:
  web:
    ports:
      - "${MONITOR_WEB_PORT:-5000}:5000"
    volumes:
      - .:/app
    environment:
      FLASK_DEBUG: "1"

  worker:
    volumes:
      - .:/app

  postgres:
    ports:
      - "${MONITOR_PG_PORT:-5432}:5432"

  redis:
    ports:
      - "${MONITOR_REDIS_PORT:-6379}:6379"
