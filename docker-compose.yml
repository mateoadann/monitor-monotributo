services:
  web:
    build: .
    ports:
      - "5001:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://monitor:monitor@postgres:5432/monitor
      SECRET_KEY: dev-change-me
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: ["python", "worker.py"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://monitor:monitor@postgres:5432/monitor
      SECRET_KEY: dev-change-me
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  postgres_data:
