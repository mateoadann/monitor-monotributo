{% extends "base.html" %}
{% block content %}
<section class="form-page">
  <div class="form-card">
    <h1>Cambiar contrasena</h1>
    {% set flash_messages = get_flashed_messages(with_categories=true) %}
    {% if flash_messages %}
      {% for category, message in flash_messages %}
        <div class="flash flash--{{ category }} flash--modal">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <form method="post" class="panel__form">
      <div class="form-grid form-grid--stack">
        <label class="field">
          Contrasena actual
          <input type="password" name="current_password" required>
        </label>
        <label class="field">
          Nueva contrasena
          <input type="password" name="new_password" required>
        </label>
        <label class="field">
          Confirmar nueva contrasena
          <input type="password" name="confirm_password" required>
        </label>
      </div>
      <div class="form-actions">
        <button class="primary" type="submit">Cambiar contrasena</button>
        <a class="ghost-link" href="{{ url_for('main.dashboard') }}">Volver</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
